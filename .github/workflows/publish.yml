name: Publish

# 2.x maintenance: fixes only. Published by hand from the v2.x branch under the `latest-2` dist-tag,
# so a 2.x release never moves `latest` off 3.x. Run it from the Actions tab with v2.x selected.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: makerxstudio/shared-config/.github/workflows/node-ci.yml@main
    with:
      audit-script: npm run audit

  publish:
    needs: ci
    uses: makerxstudio/shared-config/.github/workflows/node-trusted-publish.yml@main
    with:
      access: public
      tag: latest-2
